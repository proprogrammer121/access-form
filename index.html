<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1e4d0">
<title>Rate a Place</title>
<script>
// ---- Settings: paste your Google Apps Script web app URL between the quotes ----
const SCRIPT_URL = "";

// Phone microphones are not calibrated. This number shifts the estimate so it
// lands near real decibel readings. Adjust it after comparing with a real meter.
const OFFSET_DB = 94;
const MEASURE_SECONDS = 20;
const QUIET_BELOW = 50;   // estimated dB under this suggests "quiet"
const LOUD_ABOVE = 65;    // estimated dB over this suggests "loud"

// Text sizes offered by the accessibility bar (1 = normal size).
const SIZES = [1, 1.25, 1.5, 2];

// Apply saved accessibility choices before the page paints, so it does not jump.
(function () {
  try {
    const z = SIZES[parseInt(localStorage.getItem("a11y_size"), 10)];
    if (z) document.documentElement.style.setProperty("--zoom", z);
    if (localStorage.getItem("a11y_hc") === "1") document.documentElement.classList.add("hc");
  } catch (e) {}
})();
</script>
<style>
  :root {
    --zoom: 1;
    --bg: #f1e4d0; --card: #fbf5ea; --fg: #3a2a20; --muted: #6a5546; --line: #8a7156;
    --accent: #f06c45; --accent-hover: #ea6840; --accent-press: #e05a31; --accent-fg: #2b140b;
    --accent-strong: #a8340a; --soft: #fbd9c4;
    --ok: #1a7f37; --ok-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #261b15; --card: #35261e; --fg: #f6e9da; --muted: #cdb8a3; --line: #b0907a;
      --accent: #f58a63; --accent-hover: #f7977a; --accent-press: #f9a98f; --accent-fg: #2b140b;
      --accent-strong: #ffa17f; --soft: #4a3023;
      --ok: #4cc26b; --ok-fg: #0b2a14;
    }
  }
  /* High-contrast mode (turned on from the accessibility bar) */
  html.hc {
    --bg: #000000; --card: #000000; --fg: #ffffff; --muted: #f0f0f0; --line: #ffffff;
    --accent: #ffd60a; --accent-hover: #ffe55c; --accent-press: #fff08a; --accent-fg: #000000;
    --accent-strong: #ffd60a; --soft: #332b00;
    --ok: #39ff7a; --ok-fg: #000000;
  }

  html { -webkit-text-size-adjust: 100%; font-size: calc(106.25% * var(--zoom)); }
  * { box-sizing: border-box; }
  body { margin: 0; font: 1rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 34rem; margin: 0 auto; padding: .7rem .9rem 6rem; }
  h1 { font-size: 1.45rem; line-height: 1.2; margin: .2rem 0 .15rem; }
  .lead { color: var(--muted); margin: 0 0 .6rem; }
  .skip { position: absolute; left: -9999px; top: 0; }
  .skip:focus { left: .5rem; top: .5rem; z-index: 40; background: var(--card); color: var(--fg); padding: .5rem .8rem; border: 2px solid var(--accent-strong); border-radius: 8px; }

  /* Accessibility bar */
  .tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .35rem;
    padding: .35rem; background: var(--card); border: 2px solid var(--line); border-radius: 12px; margin: 0 0 .5rem; }
  .tool { min-height: 2.75rem; padding: .3rem .65rem; font-size: .95rem; display: inline-flex; align-items: center; justify-content: center; gap: .35rem; }
  .tool svg { width: 1.25em; height: 1.25em; flex: none; }
  .sizegroup { display: flex; align-items: center; gap: .25rem; }
  .sizegroup .tool { min-width: 2.75rem; padding: .3rem .4rem; }
  .sizelabel { font-size: .8rem; color: var(--muted); min-width: 2.4rem; text-align: center; }

  /* Form layout */
  fieldset { border: 0; padding: 0; margin: .8rem 0 .2rem; position: relative; min-width: 0; }
  legend { font-weight: 700; padding: 0 0 .3rem; }
  fieldset.has-speak legend { padding: .55rem 3.3rem .55rem 0; }
  label.field { display: block; font-weight: 700; margin: .65rem 0 .2rem; }
  input[type=text], textarea {
    width: 100%; font: inherit; padding: .55rem .7rem; min-height: 2.75rem; color: var(--fg); background: var(--card);
    border: 2px solid var(--line); border-radius: 10px;
  }
  textarea { resize: vertical; }

  .grid { display: grid; gap: .3rem .4rem; }
  .g1 { grid-template-columns: 1fr; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(max(9.5rem, 45%), 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(max(6.3rem, 30%), 1fr)); }

  .choice {
    display: flex; align-items: center; gap: .6rem; min-height: 2.75rem;
    padding: .3rem .7rem; background: var(--card); border: 2px solid var(--line);
    border-radius: 10px; cursor: pointer;
  }
  .choice input { width: 1.3rem; height: 1.3rem; flex: none; margin: 0; accent-color: var(--accent-strong); }
  .choice:has(input:checked) { background: var(--soft); border-color: var(--accent-strong); box-shadow: inset 0 0 0 1px var(--accent-strong); }
  .choice:has(input:focus-visible) { outline: 3px solid var(--fg); outline-offset: 2px; }
  .txt { display: block; min-width: 0; }
  .t { display: block; }
  .hint { display: block; color: var(--muted); font-size: .82rem; line-height: 1.25; }
  .fsnote { margin: 0 0 .35rem; color: var(--muted); font-size: .9rem; line-height: 1.3; }

  /* Buttons: light orange-red for the main ones, outlined for the rest */
  button {
    font: inherit; font-weight: 700; min-height: 2.75rem; padding: .5rem 1rem;
    border-radius: 10px; border: 2px solid var(--accent-strong); cursor: pointer;
    background: var(--card); color: var(--accent-strong);
    transition: transform .08s ease-out, background-color .15s;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:active { background: var(--accent-press); }
  button:active:not(:disabled):not([aria-disabled="true"]) { transform: scale(.98); }
  button.block { display: block; width: 100%; }
  button:disabled, button[aria-disabled="true"] { opacity: .5; cursor: default; }
  .loc { margin-top: .75rem; line-height: 1.25; }
  .sub { display: block; font-size: .82rem; font-weight: 600; margin-top: .1rem; }
  #measureBtn { margin-top: .45rem; }
  :focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

  /* Read-aloud buttons and highlight */
  .speak { position: absolute; top: 0; right: 0; width: 2.75rem; height: 2.75rem; min-height: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .speak svg { width: 1.4rem; height: 1.4rem; }
  .reading { outline: 3px solid var(--accent-strong); outline-offset: 4px; border-radius: 10px; }
  .floating { position: fixed; right: .8rem; bottom: .8rem; z-index: 30; min-height: 52px; padding: 0 1.1rem; font-size: 18px; box-shadow: 0 3px 10px rgba(0, 0, 0, .3); }

  .status { margin: .4rem 0 0; }
  .status:empty { margin: 0; }

  /* Small green check that pops in next to the location message */
  .statusrow { display: flex; align-items: center; gap: .5rem; margin-top: .4rem; min-height: 1.75rem; }
  .statusrow .status { margin: 0; }
  .check { flex: none; width: 1.75rem; height: 1.75rem; color: var(--ok); }
  .check svg { display: block; width: 100%; height: 100%; }
  .check path { stroke: var(--ok-fg); stroke-dasharray: 18; stroke-dashoffset: 0; }
  .check.pop { animation: check-pop .4s ease-out; }
  .check.pop path { animation: check-draw .3s ease-out .12s backwards; }
  @keyframes check-pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.18); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes check-draw { from { stroke-dashoffset: 18; } to { stroke-dashoffset: 0; } }

  /* Slight bounce when an answer is tapped */
  .choice.bump { animation: bump .22s ease-out; }
  @keyframes bump {
    0% { transform: none; }
    40% { transform: translateY(-2px) scale(1.025); }
    100% { transform: none; }
  }

  #thanks { margin-top: 1rem; }
  .hp { position: absolute; left: -9999px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#form">Skip to the form</a>
<main>
  <div class="tools" role="group" aria-label="Accessibility tools">
    <button type="button" id="listenBtn" class="tool"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9.5v5h3.8L12 19V5L6.8 9.5H3z" fill="currentColor"/><path d="M15.5 8.7a4.6 4.6 0 0 1 0 6.6M18.2 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="lbl">Listen</span></button>
    <div class="sizegroup" role="group" aria-label="Text size">
      <button type="button" id="smallerBtn" class="tool" aria-label="Make text smaller">A&minus;</button>
      <span id="sizeLabel" class="sizelabel" aria-live="polite">100%</span>
      <button type="button" id="largerBtn" class="tool" aria-label="Make text larger">A+</button>
    </div>
    <button type="button" id="contrastBtn" class="tool" aria-pressed="false">Contrast</button>
  </div>
  <p class="status" id="speechStatus" role="status" aria-live="polite"></p>

  <h1 data-read>Rate a place</h1>
  <p class="lead" data-read>About 5 minutes per place. Rate what an average visitor would experience.</p>

  <form id="form" novalidate>
    <label class="field" for="place">Place name</label>
    <input type="text" id="place" name="place" autocomplete="off" required data-read>

    <label class="field" for="address">Street address</label>
    <input type="text" id="address" name="address" autocomplete="street-address" required data-read>

    <button type="button" id="locBtn" class="primary block loc" data-read>Add my location <span class="sub">(Please this makes a lot less work for the devs!)</span></button>
    <div class="statusrow">
      <span class="check" id="locCheck" aria-hidden="true" hidden><svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M6.5 12.5l3.8 3.8 7.2-8" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <p class="status" id="locStatus" role="status" aria-live="polite"></p>
    </div>

    <fieldset data-read>
      <legend>Time of day</legend>
      <div class="grid g2">
        <label class="choice"><input type="radio" name="time_of_day" value="morning" required><span class="txt"><span class="t">Morning</span><span class="hint">before 11</span></span></label>
        <label class="choice"><input type="radio" name="time_of_day" value="midday"><span class="txt"><span class="t">Midday</span><span class="hint">11 to 2</span></span></label>
        <label class="choice"><input type="radio" name="time_of_day" value="afternoon"><span class="txt"><span class="t">Afternoon</span><span class="hint">2 to 5</span></span></label>
        <label class="choice"><input type="radio" name="time_of_day" value="evening"><span class="txt"><span class="t">Evening</span><span class="hint">after 5</span></span></label>
      </div>
    </fieldset>

    <fieldset data-read>
      <legend>How busy is it?</legend>
      <div class="grid g3">
        <label class="choice"><input type="radio" name="busy" value="empty" required><span class="txt"><span class="t">Empty</span></span></label>
        <label class="choice"><input type="radio" name="busy" value="half full"><span class="txt"><span class="t">Half full</span></span></label>
        <label class="choice"><input type="radio" name="busy" value="full"><span class="txt"><span class="t">Full</span></span></label>
      </div>
    </fieldset>

    <fieldset data-read>
      <legend>Noise</legend>
      <p class="fsnote">Pick what matches the conversation test. The sound reading is only a check.</p>
      <div class="grid g1">
        <label class="choice"><input type="radio" name="noise" value="quiet" required><span class="txt"><span class="t">Quiet</span><span class="hint">You can talk in a low voice</span></span></label>
        <label class="choice"><input type="radio" name="noise" value="moderate"><span class="txt"><span class="t">Moderate</span><span class="hint">You can talk normally, but you notice the noise</span></span></label>
        <label class="choice"><input type="radio" name="noise" value="loud"><span class="txt"><span class="t">Loud</span><span class="hint">You have to raise your voice</span></span></label>
      </div>
      <button type="button" id="measureBtn" class="block">Measure sound (20 seconds)</button>
      <p class="status" id="measureStatus" role="status" aria-live="polite"></p>
      <input type="hidden" name="db_avg" id="db_avg">
      <input type="hidden" name="db_peak" id="db_peak">
    </fieldset>

    <fieldset data-read>
      <legend>Lighting</legend>
      <div class="grid g1">
        <label class="choice"><input type="radio" name="lighting" value="dim" required><span class="txt"><span class="t">Dim</span><span class="hint">Hard to read a menu without a phone light</span></span></label>
        <label class="choice"><input type="radio" name="lighting" value="comfortable"><span class="txt"><span class="t">Comfortable</span><span class="hint">Easy to read, no glare</span></span></label>
        <label class="choice"><input type="radio" name="lighting" value="bright"><span class="txt"><span class="t">Bright</span><span class="hint">Harsh or glaring, even indoors</span></span></label>
      </div>
    </fieldset>

    <fieldset data-read>
      <legend>Tick anything you notice</legend>
      <div class="grid g1">
        <label class="choice"><input type="checkbox" name="triggers" value="hand dryer, espresso machine, or blender"><span class="txt"><span class="t">Hand dryer, espresso machine, or blender</span></span></label>
        <label class="choice"><input type="checkbox" name="triggers" value="loud music or echo"><span class="txt"><span class="t">Loud music or echo</span></span></label>
        <label class="choice"><input type="checkbox" name="triggers" value="flickering lights"><span class="txt"><span class="t">Flickering lights</span></span></label>
        <label class="choice"><input type="checkbox" name="triggers" value="glare or flashing screens"><span class="txt"><span class="t">Glare or flashing screens</span></span></label>
        <label class="choice"><input type="checkbox" name="triggers" value="quiet or dim area available"><span class="txt"><span class="t">A quiet or dim area is available</span></span></label>
      </div>
    </fieldset>

    <label class="field" for="note">Anything else? (optional)</label>
    <textarea id="note" name="note" rows="2" data-read></textarea>

    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <input type="hidden" name="lat" id="lat">
    <input type="hidden" name="lng" id="lng">

    <p class="status" id="formStatus" role="alert"></p>
    <button type="submit" class="primary block" id="submitBtn" data-read style="margin-top:.8rem">Submit</button>
  </form>

  <section id="thanks" hidden tabindex="-1">
    <h2>Thank you!</h2>
    <p>Your rating was sent.</p>
    <button type="button" id="againBtn" class="primary">Rate another place</button>
  </section>
</main>

<button type="button" id="zoomReset" class="primary floating" hidden>Normal size</button>

<script>
const $ = (id) => document.getElementById(id);
const form = $("form");
const root = document.documentElement;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

// Small bounce when someone taps an answer.
form.addEventListener("change", (e) => {
  const label = e.target.closest && e.target.closest(".choice");
  if (!label) return;
  label.classList.remove("bump");
  void label.offsetWidth;            // restart the animation if it is already running
  label.classList.add("bump");
});
form.addEventListener("animationend", (e) => {
  if (e.target.classList && e.target.classList.contains("bump")) e.target.classList.remove("bump");
});

function presetTimeOfDay() {
  const h = new Date().getHours();
  const slot = h < 11 ? "morning" : h < 14 ? "midday" : h < 17 ? "afternoon" : "evening";
  const radio = form.querySelector('input[name="time_of_day"][value="' + slot + '"]');
  if (radio) radio.checked = true;
}

// ---- Accessibility: text size and contrast -------------------------------
let sizeIdx = 0;
function applySize(save) {
  root.style.setProperty("--zoom", SIZES[sizeIdx]);
  $("sizeLabel").textContent = Math.round(SIZES[sizeIdx] * 100) + "%";
  $("smallerBtn").setAttribute("aria-disabled", sizeIdx === 0 ? "true" : "false");
  $("largerBtn").setAttribute("aria-disabled", sizeIdx === SIZES.length - 1 ? "true" : "false");
  $("zoomReset").hidden = sizeIdx === 0;
  if (save) store("a11y_size", String(sizeIdx));
}
$("largerBtn").addEventListener("click", () => { if (sizeIdx < SIZES.length - 1) { sizeIdx++; applySize(true); } });
$("smallerBtn").addEventListener("click", () => { if (sizeIdx > 0) { sizeIdx--; applySize(true); } });
$("zoomReset").addEventListener("click", () => {
  const hadFocus = document.activeElement === $("zoomReset");
  sizeIdx = 0;
  applySize(true);
  if (hadFocus) $("largerBtn").focus();   // the button just disappeared, so keep keyboard focus somewhere sensible
});

function applyContrast(on, save) {
  root.classList.toggle("hc", on);
  $("contrastBtn").setAttribute("aria-pressed", on ? "true" : "false");
  if (save) store("a11y_hc", on ? "1" : "0");
}
$("contrastBtn").addEventListener("click", () => applyContrast(!root.classList.contains("hc"), true));

const savedSize = parseInt(recall("a11y_size"), 10);
if (savedSize >= 0 && savedSize < SIZES.length) sizeIdx = savedSize;
applySize(false);
applyContrast(recall("a11y_hc") === "1", false);

// ---- Accessibility: read aloud ---------------------------------------------
const synth = ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window) ? window.speechSynthesis : null;
const SPEAKER_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9.5v5h3.8L12 19V5L6.8 9.5H3z" fill="currentColor"/><path d="M15.5 8.7a4.6 4.6 0 0 1 0 6.6M18.2 6a8.4 8.4 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
let session = 0, speaking = false, singleTarget = null, watchdog = null;

function clean(t) { return String(t || "").replace(/\s+/g, " ").trim(); }
function nameOf(choice) { return clean(choice.querySelector(".t").textContent); }

// Turns a piece of the page into short sentences the voice reads one at a time.
function describe(el) {
  if (el.matches("fieldset")) {
    const lines = [clean(el.querySelector("legend").textContent) + "."];
    const note = el.querySelector(".fsnote");
    if (note) lines.push(clean(note.textContent));
    const choices = [...el.querySelectorAll(".choice")];
    const multi = choices.length > 0 && choices[0].querySelector("input").type === "checkbox";
    lines.push(multi ? "You can pick more than one." : "Pick one.");
    choices.forEach((c) => {
      const hint = c.querySelector(".hint");
      lines.push(nameOf(c) + (hint ? ". " + clean(hint.textContent) + "." : "."));
    });
    const picked = choices.filter((c) => c.querySelector("input").checked).map(nameOf);
    lines.push(picked.length ? "Selected: " + picked.join(", ") + "." : "Nothing selected yet.");
    el.querySelectorAll("button:not(.speak)").forEach((b) => lines.push("Button: " + clean(b.textContent) + "."));
    return lines;
  }
  if (el.matches("input, textarea")) {
    const lab = document.querySelector('label[for="' + el.id + '"]');
    const v = clean(el.value);
    return [clean(lab ? lab.textContent : "") + ".", v ? "You entered: " + v + "." : "Empty."];
  }
  if (el.matches("button")) return ["Button: " + clean(el.textContent) + "."];
  return [clean(el.textContent)];
}

function mark(el) {
  el.classList.add("reading");
  el.scrollIntoView({ block: "center", behavior: reduceMotion ? "auto" : "smooth" });
}
function setSpeaking(on) {
  speaking = on;
  $("listenBtn").querySelector(".lbl").textContent = on ? "Stop" : "Listen";
}
function stopSpeaking() {
  session++;                       // makes any late events from the old reading do nothing
  clearTimeout(watchdog);
  if (synth) synth.cancel();
  document.querySelectorAll(".reading").forEach((e) => e.classList.remove("reading"));
  singleTarget = null;
  setSpeaking(false);
}

function readAloud(parts, single) {
  if (!synth) return;
  stopSpeaking();
  const mine = session;
  singleTarget = single || null;
  setSpeaking(true);
  $("speechStatus").textContent = "";
  let started = false;
  parts.forEach((p, pi) => {
    p.lines.forEach((line, li) => {
      const u = new SpeechSynthesisUtterance(line);
      u.lang = root.lang || "en-US";
      u.onstart = () => {
        if (mine !== session) return;
        started = true;
        if (li === 0) mark(p.el);
      };
      const finish = () => {
        if (mine !== session) return;
        if (li === p.lines.length - 1) p.el.classList.remove("reading");
        if (pi === parts.length - 1 && li === p.lines.length - 1) stopSpeaking();
      };
      u.onend = finish;
      u.onerror = finish;
      synth.speak(u);
    });
  });
  // Some devices have no voice installed and stay silent. Say so instead of doing nothing.
  watchdog = setTimeout(() => {
    if (mine !== session || started) return;
    stopSpeaking();
    $("speechStatus").textContent = "Reading aloud did not start. Check your volume and that text-to-speech is turned on for this device.";
  }, 3000);
}

if (synth) {
  $("listenBtn").addEventListener("click", () => {
    if (speaking) { stopSpeaking(); return; }
    const parts = [...document.querySelectorAll("[data-read]")]
      .filter((el) => !el.closest("[hidden]"))
      .map((el) => ({ el: el, lines: describe(el) }));
    readAloud(parts, null);
  });
  document.querySelectorAll("fieldset[data-read]").forEach((fs) => {
    const legend = fs.querySelector("legend");
    const b = document.createElement("button");
    b.type = "button";
    b.className = "speak";
    b.setAttribute("aria-label", "Read this question aloud: " + clean(legend.textContent));
    b.innerHTML = SPEAKER_SVG;
    b.addEventListener("click", () => {
      if (speaking && singleTarget === fs) { stopSpeaking(); return; }
      readAloud([{ el: fs, lines: describe(fs) }], fs);
    });
    legend.after(b);
    fs.classList.add("has-speak");
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && speaking) stopSpeaking(); });
  window.addEventListener("pagehide", stopSpeaking);
} else {
  $("listenBtn").hidden = true;      // this browser has no built-in voice
}

// ---- Location -------------------------------------------------------------
function showCheck() {
  const c = $("locCheck");
  c.hidden = false;
  c.classList.remove("pop");
  void c.offsetWidth;                // restart the animation if it already ran
  c.classList.add("pop");
}
function hideCheck() {
  const c = $("locCheck");
  c.hidden = true;
  c.classList.remove("pop");
}

$("locBtn").addEventListener("click", () => {
  const status = $("locStatus");
  hideCheck();
  if (!navigator.geolocation) { status.textContent = "Location is not available on this device."; return; }
  status.textContent = "Finding your location...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      $("lat").value = pos.coords.latitude.toFixed(5);
      $("lng").value = pos.coords.longitude.toFixed(5);
      status.textContent = "Location added.";
      showCheck();
    },
    () => { hideCheck(); status.textContent = "Could not get your location. You can skip this."; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

// ---- Sound meter ----------------------------------------------------------
$("measureBtn").addEventListener("click", async () => {
  const btn = $("measureBtn");
  const status = $("measureStatus");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    status.textContent = "This browser cannot measure sound. Please pick a level yourself.";
    return;
  }
  btn.disabled = true;
  let stream, ctx;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    await ctx.resume();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const buf = new Float32Array(analyser.fftSize);

    const levels = [];   // one estimated dB value per 100 ms
    const start = Date.now();
    await new Promise((resolve) => {
      const timer = setInterval(() => {
        analyser.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.max(Math.sqrt(sum / buf.length), 1e-8);
        levels.push(20 * Math.log10(rms) + OFFSET_DB);
        const left = Math.max(0, MEASURE_SECONDS - Math.round((Date.now() - start) / 1000));
        status.textContent = "Listening... " + left + " seconds left. Nothing is recorded.";
        if (Date.now() - start >= MEASURE_SECONDS * 1000) { clearInterval(timer); resolve(); }
      }, 100);
    });

    // Average by energy (not by simple mean of dB values).
    const energy = levels.reduce((a, d) => a + Math.pow(10, d / 10), 0) / levels.length;
    // Very quiet or blocked microphones can compute below zero; keep readings sensible.
    const avg = Math.max(0, Math.round(10 * Math.log10(energy)));
    const peak = Math.max(0, Math.round(Math.max.apply(null, levels)));
    $("db_avg").value = avg;
    $("db_peak").value = peak;

    const level = avg < QUIET_BELOW ? "quiet" : avg > LOUD_ABOVE ? "loud" : "moderate";
    const radio = form.querySelector('input[name="noise"][value="' + level + '"]');
    if (radio) radio.checked = true;
    status.textContent = "About " + avg + " dB (rough estimate). We selected \"" + level +
      "\". Change it if that does not match what you hear.";
  } catch (err) {
    status.textContent = (err && err.name === "NotAllowedError")
      ? "Microphone access was blocked. You can pick a level yourself."
      : "Could not use the microphone. You can pick a level yourself.";
  } finally {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    if (ctx) ctx.close();
    btn.disabled = false;
  }
});

// ---- Submit ---------------------------------------------------------------
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  stopSpeaking();
  const status = $("formStatus");
  status.textContent = "";

  const missing = [];
  if (!$("place").value.trim()) missing.push("place name");
  if (!$("address").value.trim()) missing.push("street address");
  ["time_of_day", "busy", "noise", "lighting"].forEach((name) => {
    if (!form.querySelector('input[name="' + name + '"]:checked')) missing.push(name.replace("_", " "));
  });
  if (missing.length) { status.textContent = "Please fill in: " + missing.join(", ") + "."; return; }

  const fd = new FormData(form);
  if (fd.get("website")) { showThanks(); return; }   // spam trap

  if (!SCRIPT_URL) {
    status.textContent = "Setup needed: the form is not connected to a Google Sheet yet. See README.md.";
    return;
  }

  const body = new URLSearchParams();
  fd.forEach((value, key) => { if (key !== "triggers") body.append(key, value); });
  body.set("triggers", fd.getAll("triggers").join("; "));
  body.set("submitted_at", new Date().toISOString());

  $("submitBtn").disabled = true;
  try {
    // no-cors: the browser cannot read the reply, so we assume success unless the network fails.
    await fetch(SCRIPT_URL, { method: "POST", mode: "no-cors", body: body });
    showThanks();
  } catch (err) {
    status.textContent = "Could not send. Check your connection and try again.";
  } finally {
    $("submitBtn").disabled = false;
  }
});

function showThanks() {
  form.hidden = true;
  $("thanks").hidden = false;
  $("thanks").focus();
}

$("againBtn").addEventListener("click", () => {
  form.reset();
  $("db_avg").value = $("db_peak").value = $("lat").value = $("lng").value = "";
  $("locStatus").textContent = "";
  hideCheck();
  $("measureStatus").textContent = "";
  $("formStatus").textContent = "";
  presetTimeOfDay();
  $("thanks").hidden = true;
  form.hidden = false;
  window.scrollTo(0, 0);
  $("place").focus();
});

presetTimeOfDay();
</script>
</body>
